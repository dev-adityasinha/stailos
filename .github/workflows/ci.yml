name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest -q

  frontend:
    name: Frontend lint, build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build

  e2e:
    name: Cross-browser e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Start backend
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: "sqlite:///./e2e.db"
          FRONTEND_ORIGIN: "http://localhost:3000"
          EMAIL_PROVIDER: "console"
          ENVIRONMENT: "development"
          REMINDER_SCHEDULER_ENABLED: "false"
          # 3 browsers x the full e2e suite register/login against one shared
          # backend in a short window — raise the ceiling for CI only, prod
          # default (20/60s) is untouched.
          AUTH_RATE_LIMIT_REQUESTS: "500"
        run: |
          nohup uvicorn app.main:app --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: "http://localhost:8000/api/v1"
        run: pnpm build
      - name: Run e2e tests
        working-directory: frontend
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
